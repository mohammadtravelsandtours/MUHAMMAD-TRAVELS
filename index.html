/* ---------------- B2B TRAVEL AGENCY PORTAL ----------------
/* ---------------- B2B TRAVEL AGENCY PORTAL ----------------
   A separate login/dashboard for travel agencies booking on behalf of their
   clients — distinct branding and fields from the consumer login. */
function agencyLoginHTML(){
  const f=state.agencyForm; const e=state.errors; const cap=state.captcha.agency;
  return `<div class="page-body">
    <div class="auth-wrap" style="max-width:440px;">
      <div class="card" style="border-top:3px solid var(--gold);">
        <div class="hc-badge" style="background:#FDF1DF;color:var(--gold-deep);border-color:#F0DDB0;">B2B Partner Portal</div>
        <h3 style="margin-top:8px;">Travel agency login</h3>
        <div class="card-sub">For registered travel agents and corporate partners booking on behalf of clients.</div>
        <div style="display:flex;flex-direction:column;gap:12px;">
          <div class="fg ${e.ag_name?'invalid':''}"><label>Agency name <span class="req-star">*</span></label><input type="text" value="${f.agencyName}" oninput="state.agencyForm.agencyName=this.value" placeholder="e.g. Sundarban Travel &amp; Tours"><span class="err">Please enter your agency name.</span></div>
          <div class="fg ${e.ag_iata?'invalid':''}"><label>IATA / TIDS number <span class="req-star">*</span></label><input type="text" value="${f.iataCode}" oninput="state.agencyForm.iataCode=this.value" placeholder="e.g. 12-3 4567"><span class="err">Please enter your agency's IATA/TIDS number.</span></div>
          <div class="fg ${e.ag_email?'invalid':''}"><label>Business email <span class="req-star">*</span></label><input type="email" value="${f.email}" oninput="state.agencyForm.email=this.value" placeholder="agent@youragency.com"><span class="err">Please enter a valid business email.</span></div>
          <div class="fg ${e.ag_password?'invalid':''}"><label>Password <span class="req-star">*</span></label><input type="password" value="${f.password}" oninput="state.agencyForm.password=this.value" placeholder="••••••••"><span class="err">Please enter your password.</span></div>
          ${captchaWidget('agency')}
          ${e.ag_captcha?'<div class="err" style="display:block;">Please confirm you are not a robot.</div>':''}
        </div>
        <button class="btn btn-primary" style="width:100%;margin-top:16px;" onclick="submitAgencyLogin()">Log in to partner portal</button>
        <div class="security-note">🔒 <span>New agency? In production this would route to a verification &amp; contracting workflow before granting net-fare access — this demo logs any complete form straight in.</span></div>
      </div>
    </div>
  </div>`;
}
function submitAgencyLogin(){
  const f=state.agencyForm; const errors={};
  if(!f.agencyName.trim()) errors.ag_name=true;
  if(!f.iataCode.trim()) errors.ag_iata=true;
  if(!f.email.includes('@')) errors.ag_email=true;
  if(!f.password) errors.ag_password=true;
  if(!state.captcha.agency.checked) errors.ag_captcha=true;
  state.errors=errors;
  if(Object.keys(errors).length){ render(); showToast('Please complete the required fields'); return; }
  state.agencyUser = {agencyName:f.agencyName.trim(), iataCode:f.iataCode.trim(), email:f.email.trim()};
  state.agencyForm={agencyName:'',iataCode:'',contactPerson:'',email:'',phone:'',password:''};
  state.captcha.agency={checked:false,loading:false};
  showToast('Logged in to the partner portal');
  state.view='agencyDashboard'; render();
}
function agencyLogoutUser(){ state.agencyUser=null; showToast('Logged out of the partner portal'); state.view='home'; render(); }
function agencyDashboardHTML(){
  const a=state.agencyUser; const c=state.agencyCompare;
  return `
  <div class="page-hero" style="background:linear-gradient(100deg,var(--navy),#173B57);"><div class="container">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
      <div><h1 style="margin-bottom:4px;">Welcome, ${a.agencyName}</h1><p>IATA/TIDS ${a.iataCode} · Partner portal</p></div>
      <button class="btn btn-ghost-dark" onclick="agencyLogoutUser()">Log out</button>
    </div>
  </div></div>
  <div class="page-body">
    <div class="card">
      <h3>Check the best fare for your client</h3>
      <div class="card-sub">We check our fare network and quote you Mohammad Travels' best available selling price — our supplier sourcing stays internal, same as it would for any other customer.</div>
      <div class="form-grid g3">
        <div class="fg"><label>From</label><select onchange="state.agencyCompare.fromCode=this.value">${AIRPORTS.map(ap=>`<option value="${ap.code}" ${c.fromCode===ap.code?'selected':''}>${ap.city} (${ap.code})</option>`).join('')}</select></div>
        <div class="fg"><label>To</label><select onchange="state.agencyCompare.toCode=this.value">${AIRPORTS.map(ap=>`<option value="${ap.code}" ${c.toCode===ap.code?'selected':''}>${ap.city} (${ap.code})</option>`).join('')}</select></div>
        <div class="fg"><label>Date</label><input type="date" value="${c.date}" onchange="state.agencyCompare.date=this.value"></div>
      </div>
      <button class="btn btn-primary" style="margin-top:14px;" onclick="runAgencyCompare()">Check best fare</button>
      ${c.result ? `<div style="margin-top:16px;padding:14px;background:var(--success-bg);border-radius:10px;"><div style="font-size:12px;color:var(--ink-faint);">Best available price</div><div style="font-size:20px;font-weight:700;color:var(--success);">${fmtMoney(c.result.sellingPrice)}</div></div><button class="btn btn-outline" style="margin-top:10px;" onclick="bookAgencyFare()">Search this route to book for a client</button>` : ''}
    </div>
    <div class="card">
      <h3>This session's agency bookings</h3>
      ${state.adminNotifications.filter(n=>n.agent===a.agencyName).length===0 ? `<p style="color:var(--ink-faint);font-size:13.5px;">No bookings made under your agency yet this session.</p>` :
        state.adminNotifications.filter(n=>n.agent===a.agencyName).map(n=>`<div class="review-row"><span>${n.kind==='flight'?n.route:n.hotel}</span><span>${n.total}</span></div>`).join('')}
    </div>
  </div>`;
}
function runAgencyCompare(){
  const c=state.agencyCompare;
  if(c.fromCode===c.toCode){ showToast('Choose two different airports'); return; }
  const from=AIRPORTS.find(a=>a.code===c.fromCode), to=AIRPORTS.find(a=>a.code===c.toCode);
  const flights=genFlights(from,to);
  const cheapest=[...flights].sort((x,y)=>x.price-y.price)[0];
  const rows = simulateFareComparison(cheapest.price, c.fromCode+c.toCode+c.date, getActiveSources());
  const netFare = rows[0].price;
  const markup = computeMarkup(netFare, c.fromCode, c.toCode, state.cabin);
  c.result = {netFare, markup, sellingPrice: netFare+markup};
  render();
}
function bookAgencyFare(){
  const c=state.agencyCompare;
  state.from=AIRPORTS.find(a=>a.code===c.fromCode); state.to=AIRPORTS.find(a=>a.code===c.toCode);
  state.departDate=c.date; state.tripType='oneway';
  doSearch();
}

/* ---------------- AI ASSISTANT (scripted demo + simulated price-check) ---------------- */
let aiStep=0;
const aiScript=[
  {bot:"Hi! I'm the Mohammad Travels assistant. Where would you like to fly from and to, or ask me to check a destination's price?", quick:['Dhaka to Singapore','Dhaka to Dubai','Check a price']},
  {bot:"Got it — {route}. What date would you like to travel?", quick:['10 October','Flexible']},
  {bot:"Would you like one-way or return?", quick:['Return','One-way']},
  {bot:"Searching our airline partners for real fares now — I'll open the results for you.", quick:['Show results']},
];
let aiRoute='';
let aiPendingDest=null, aiPendingOrigin=null;
function toggleAI(){
  const panel=document.getElementById('aiPanel');
  panel.classList.toggle('open');
  if(panel.classList.contains('open') && !panel.dataset.started){
    panel.dataset.started='1'; aiStep=0; aiRoute='';
    document.getElementById('aiBody').innerHTML='';
    pushAI(aiScript[0].bot, aiScript[0].quick);
  }
}
function pushAI(text,quick){
  const body=document.getElementById('aiBody');
  body.insertAdjacentHTML('beforeend', `<div class="msg bot">${text}</div>`);
  body.scrollTop=body.scrollHeight;
  const q=document.getElementById('aiQuick');
  q.innerHTML = (quick||[]).map(c=>`<button class="qchip" onclick="aiPick('${c.replace(/'/g,"\\'")}')">${c}</button>`).join('');
}
function aiSendText(){
  const input=document.getElementById('aiTextInput');
  const text=input.value.trim();
  if(!text) return;
  const body=document.getElementById('aiBody');
  body.insertAdjacentHTML('beforeend', `<div class="msg user">${text}</div>`);
  body.scrollTop=body.scrollHeight;
  document.getElementById('aiQuick').innerHTML='';
  input.value='';
  aiRespond(text);
}
/* Simulated intent handling: detects a destination + price-related wording and
   runs the same simulateFareComparison() used elsewhere in the app. This is
   NOT a live price lookup — see the note above simulateFareComparison(). */
function aiRespond(userText){
  const t=userText.toLowerCase();
  const priceIntent = /price|fare|compare|cheap|cost/.test(t);
  const destAirport = AIRPORTS.find(a=> t.includes(a.city.toLowerCase()) || t.includes(a.code.toLowerCase()));
  setTimeout(()=>{
    if(priceIntent){
      if(!destAirport){
        pushAI("Which destination would you like me to check? For example: \"check price for Bangkok\".");
        return;
      }
      const origin = (state.from && state.from.code!==destAirport.code) ? state.from : AIRPORTS.find(a=>a.code==='DAC');
      const flights = genFlights(origin, destAirport);
      const cheapestOwn = [...flights].sort((a,b)=>a.price-b.price)[0];
      const sources = getActiveSources();
      const rows = simulateFareComparison(cheapestOwn.price, origin.code+destAirport.code+todayISO(30), sources);
      const netFare = rows[0].price;
      const sellingPrice = netFare + computeMarkup(netFare, origin.code, destAirport.code, state.cabin);
      aiPendingDest=destAirport; aiPendingOrigin=origin;
      pushAI(`I checked our fare network for ${origin.city} → ${destAirport.city}. Best price I found: <strong>${fmtMoney(sellingPrice)}</strong> per passenger.`, ['Search this route']);
    } else if(destAirport){
      aiPendingDest=destAirport; aiPendingOrigin=state.from||AIRPORTS.find(a=>a.code==='DAC');
      pushAI(`Want me to search flights to ${destAirport.city}, or check its price across our network first?`, ['Search flights','Check price']);
    } else {
      pushAI("I can help you search flights, check a destination's price, or answer baggage and visa questions. Try: \"check price for Dubai\".");
    }
  }, 500);
}
function aiPick(choice){
  const body=document.getElementById('aiBody');
  body.insertAdjacentHTML('beforeend', `<div class="msg user">${choice}</div>`);
  body.scrollTop=body.scrollHeight;
  document.getElementById('aiQuick').innerHTML='';
  if(choice==='Check a price'){
    setTimeout(()=>pushAI("Sure — which destination? For example: Bangkok, Dubai, Kuala Lumpur, Jeddah."),400);
    return;
  }
  if(choice==='Search this route' || choice==='Search flights'){
    if(aiPendingDest){
      const dest=aiPendingDest, origin=aiPendingOrigin||AIRPORTS.find(a=>a.code==='DAC');
      toggleAI(); state.from=origin; state.to=dest; doSearch();
    }
    return;
  }
  if(choice==='Check price'){
    if(aiPendingDest) aiRespond('check price for '+aiPendingDest.city);
    return;
  }
  if(aiStep===0){ aiRoute=choice; }
  aiStep++;
  setTimeout(()=>{
    if(aiStep<aiScript.length){
      let text=aiScript[aiStep].bot.replace('{route}',aiRoute);
      pushAI(text, aiScript[aiStep].quick);
    }
    if(choice==='Show results'){
      toggleAI();
      if(aiRoute.toLowerCase().includes('dubai')){ state.to=AIRPORTS.find(a=>a.code==='DXB'); } else { state.to=AIRPORTS.find(a=>a.code==='SIN'); }
      state.from=AIRPORTS.find(a=>a.code==='DAC');
      doSearch();
    }
  }, 500);
}

/* ---------------- INIT ---------------- */
render();
</script>
