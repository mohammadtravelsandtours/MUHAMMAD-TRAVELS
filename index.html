<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MOHAMMAD TRAVELS — Fly Simply</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F6F3;
    --surface:#FFFFFF;
    --ink:#0F2438;
    --ink-soft:#5B6B78;
    --ink-faint:#8B99A3;
    --navy:#0E2A43;
    --navy-deep:#081A2C;
    --gold:#D99A3F;
    --gold-deep:#B87F2D;
    --teal:#12707A;
    --coral:#E15A3C;
    --border:#E1E4DF;
    --border-soft:#ECEEEA;
    --success:#1E8A5B;
    --success-bg:#E8F5EE;
    --r-sm:8px;
    --r-md:14px;
    --r-lg:22px;
    --shadow:0 1px 2px rgba(15,36,56,0.06), 0 8px 24px rgba(15,36,56,0.06);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4,.disp{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.01em;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  img{max-width:100%;display:block;}
  .container{max-width:1180px;margin:0 auto;padding:0 24px;}
  ::selection{background:var(--gold);color:#fff;}

  /* Header */
  header.site{position:sticky;top:0;z-index:50;background:var(--navy-deep);}
  .header-row{display:flex;align-items:center;justify-content:space-between;height:72px;}
  .logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:19px;}
  .logo .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--gold),var(--gold-deep));display:flex;align-items:center;justify-content:center;color:var(--navy-deep);font-size:16px;}
  nav.main-nav{display:flex;gap:28px;}
  nav.main-nav a{color:rgba(255,255,255,0.75);font-size:14.5px;font-weight:500;transition:color .15s;}
  nav.main-nav a:hover{color:#fff;}
  .header-actions{display:flex;align-items:center;gap:14px;}
  .btn{border:none;border-radius:10px;padding:10px 18px;font-size:14.5px;font-weight:600;transition:transform .1s, background .15s, box-shadow .15s;}
  .btn:active{transform:scale(0.98);}
  .btn-gold{background:var(--gold);color:var(--navy-deep);}
  .btn-gold:hover{background:var(--gold-deep);}
  .btn-ghost-dark{background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.25);}
  .btn-ghost-dark:hover{border-color:rgba(255,255,255,0.5);}
  .btn-outline{background:transparent;color:var(--navy);border:1.5px solid var(--border);}
  .btn-outline:hover{border-color:var(--navy);}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--navy-deep);}
  .btn-text{background:none;color:var(--teal);font-weight:600;padding:6px 4px;}
  .link-plain{color:rgba(255,255,255,0.85);font-size:14px;font-weight:600;}
  .burger{display:none;background:none;border:none;color:#fff;font-size:24px;}

  /* Hero */
  .hero{background:radial-gradient(1200px 500px at 15% -10%, rgba(217,154,63,0.18), transparent), var(--navy);padding:56px 0 190px;position:relative;overflow:hidden;}
  .hero:after{content:"";position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,.25) 1px, transparent 0),radial-gradient(1px 1px at 60% 15%, rgba(255,255,255,.18) 1px, transparent 0),radial-gradient(1px 1px at 80% 55%, rgba(255,255,255,.2) 1px, transparent 0);opacity:.6;pointer-events:none;}
  .hero h1{color:#fff;font-size:44px;line-height:1.08;margin:0 0 14px;max-width:640px;}
  .hero p{color:rgba(255,255,255,0.72);font-size:16.5px;max-width:520px;margin:0;}
  .hero-inner{position:relative;z-index:2;}

  .hc-badge{display:inline-block;background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.3);font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:6px;margin-bottom:9px;color:#fff;}

  /* Search card */
  .search-card{background:var(--surface);border-radius:var(--r-lg);box-shadow:0 20px 50px rgba(8,26,44,0.28);margin-top:-130px;position:relative;z-index:5;padding:22px;}
  .trip-tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
  .trip-tab.manage-tab{margin-left:auto;color:var(--teal);border-color:var(--border);background:#F3F9FA;}
  .trip-tab.manage-tab:hover{border-color:var(--teal);}
  .trip-tab{padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:#fff;color:var(--ink-soft);font-size:13.5px;font-weight:600;}
  .trip-tab.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .search-grid{display:grid;grid-template-columns:1.3fr 1.3fr 1fr 1fr 1fr;gap:0;border:1px solid var(--border);border-radius:var(--r-md);overflow:visible;position:relative;}
  .search-grid.oneway{grid-template-columns:1.3fr 1.3fr 1fr 1fr 1fr;}
  .field{padding:12px 16px;border-right:1px solid var(--border-soft);position:relative;cursor:pointer;}
  .field:last-child{border-right:none;}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);font-weight:600;margin-bottom:4px;}
  .field .value{font-size:15.5px;font-weight:600;color:var(--ink);}
  .field .sub{font-size:12.5px;color:var(--ink-faint);margin-top:1px;}
  .swap-btn{position:absolute;right:-17px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--border);z-index:9;box-shadow:var(--shadow);color:var(--navy);font-size:15px;display:flex;align-items:center;justify-content:center;transition:transform .35s ease;}
  .swap-btn.spin{transform:translateY(-50%) rotate(180deg);}
  .mc-fields .swap-btn.spin{transform:rotate(180deg);}

  /* Multi-city (Singapore Airlines-style segment builder) */
  .mc-segments{display:flex;flex-direction:column;gap:12px;margin-bottom:14px;}
  .mc-row{display:flex;align-items:center;gap:12px;}
  .mc-num{width:64px;flex-shrink:0;font-size:12.5px;font-weight:700;color:var(--ink-faint);}
  .mc-route-preview{display:block;font-size:11px;color:var(--navy);font-weight:700;margin-top:2px;}
  .mc-fields{display:grid;grid-template-columns:1fr auto 1fr 0.8fr;gap:0;border:1px solid var(--border);border-radius:var(--r-md);flex:1;align-items:stretch;}
  .mc-fields .field{border-right:1px solid var(--border-soft);}
  .mc-fields .field:last-child{border-right:none;}
  .mc-fields .swap-btn{border-radius:0;background:var(--bg);border:none;border-right:1px solid var(--border-soft);width:44px;box-shadow:none;position:static;transform:none;}
  .mc-remove{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:#fff;color:var(--coral);font-size:14px;flex-shrink:0;}
  .mc-remove:hover{border-color:var(--coral);}
  .mc-add-row{margin-bottom:18px;}
  .mc-max-note{font-size:12.5px;color:var(--ink-faint);}
  .mc-bottom-row{display:flex;gap:14px;align-items:flex-end;}
  .field.return-disabled .value{color:var(--ink-faint);}
  .search-cta-row{display:flex;justify-content:flex-end;margin-top:16px;}
  .inline-warn{color:var(--coral);font-size:13px;font-weight:600;display:flex;align-items:center;margin-right:auto;}
  .btn-search{background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:var(--navy-deep);padding:14px 30px;border-radius:12px;font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:8px;}

  /* dropdown panels */
  .dropdown-panel{position:absolute;top:calc(100% + 10px);left:0;min-width:340px;background:#fff;border:1px solid var(--border);border-radius:var(--r-md);box-shadow:0 18px 40px rgba(8,26,44,0.18);padding:14px;z-index:40;cursor:default;}
  .dropdown-panel input[type=text]{width:100%;padding:11px 12px;border-radius:9px;border:1.5px solid var(--border);font-size:14.5px;margin-bottom:10px;font-family:inherit;}
  .dropdown-panel input[type=text]:focus{outline:none;border-color:var(--teal);}
  .airport-group-label{font-size:11px;text-transform:uppercase;color:var(--ink-faint);font-weight:700;letter-spacing:.04em;margin:10px 0 6px;}
  .airport-row{display:flex;align-items:center;gap:12px;padding:9px 8px;border-radius:9px;}
  .airport-row:hover{background:var(--bg);}
  .airport-code{width:38px;height:30px;border-radius:6px;background:var(--navy);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .airport-name{font-size:14px;font-weight:600;}
  .airport-loc{font-size:12.5px;color:var(--ink-faint);}
  .cal-panel{min-width:300px;}
  .cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700;font-size:14.5px;}
  .cal-nav{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:#fff;color:var(--navy);font-size:14px;display:flex;align-items:center;justify-content:center;}
  .cal-nav:disabled{opacity:.3;cursor:not-allowed;}
  .cal-quick{display:flex;gap:6px;margin-bottom:12px;}
  .cal-quick-chip{flex:1;padding:7px 4px;border-radius:8px;border:1px solid var(--border);background:var(--bg);font-size:12px;font-weight:600;color:var(--navy);}
  .cal-quick-chip:hover{border-color:var(--teal);}
  .recent-search-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;}
  .recent-search-label{font-size:12.5px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.03em;}
  .recent-chip{background:#fff;border:1px solid var(--border);border-radius:20px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--navy);}
  .recent-chip span{font-weight:500;color:var(--ink-faint);}
  .recent-chip:hover{border-color:var(--navy);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;}
  .cal-dow{font-size:11px;color:var(--ink-faint);font-weight:700;padding-bottom:4px;}
  .cal-day{padding:8px 0;border-radius:8px;font-size:13.5px;font-weight:500;}
  .cal-day.disabled{color:#D6DAD6;}
  .cal-day.sel{background:var(--navy);color:#fff;font-weight:700;}
  .cal-day:not(.disabled):hover{background:var(--bg);}
  .pax-panel{min-width:290px;}
  .pax-row{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid var(--border-soft);}
  .pax-row:last-of-type{border-bottom:none;}
  .pax-row .t{font-weight:600;font-size:14.5px;}
  .pax-row .s{font-size:12px;color:var(--ink-faint);}
  .stepper{display:flex;align-items:center;gap:12px;}
  .stepper button{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border);background:#fff;font-size:15px;color:var(--navy);}
  .stepper button:disabled{opacity:.3;cursor:not-allowed;}
  .stepper .n{width:16px;text-align:center;font-weight:700;}
  .pax-done{width:100%;margin-top:10px;}
  .cabin-list{display:flex;flex-direction:column;gap:4px;}
  .cabin-opt{padding:10px 12px;border-radius:9px;font-size:14.5px;font-weight:600;display:flex;justify-content:space-between;}
  .cabin-opt:hover{background:var(--bg);}
  .cabin-opt.sel{background:var(--navy);color:#fff;}

  /* sections below hero */
  .section{padding:56px 0;}
  .section h2{font-size:26px;margin:0 0 6px;}
  .section .lead{color:var(--ink-soft);font-size:15px;margin:0 0 28px;}
  .dest-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  .dest-card{border-radius:var(--r-md);overflow:hidden;background:var(--surface);border:1px solid var(--border);transition:transform .15s, box-shadow .15s;}
  .dest-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);}
  .dest-img{height:130px;background:linear-gradient(135deg,var(--teal),var(--navy));display:flex;align-items:flex-end;padding:12px;color:#fff;font-weight:700;font-size:15px;}
  .dest-body{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;}
  .dest-body .from{font-size:12.5px;color:var(--ink-faint);}
  .dest-body .price{font-weight:700;color:var(--navy);}
  .trust-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;text-align:center;}
  .trust-item .icon{width:46px;height:46px;border-radius:12px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:20px;}
  .trust-item h4{margin:0 0 4px;font-size:14.5px;}
  .trust-item p{margin:0;font-size:13px;color:var(--ink-soft);}
  footer.site{background:var(--navy-deep);color:rgba(255,255,255,0.65);padding:44px 0 26px;font-size:13.5px;}
  .footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:24px;margin-bottom:30px;}
  .footer-grid h5{color:#fff;font-size:13px;margin:0 0 12px;letter-spacing:.03em;}
  .footer-grid a{display:block;color:rgba(255,255,255,0.6);margin-bottom:9px;}
  .footer-grid a:hover{color:#fff;}
  .footer-bottom{border-top:1px solid rgba(255,255,255,0.1);padding-top:18px;display:flex;justify-content:space-between;}

  /* Results page */
  .results-page{padding-bottom:70px;}
  .summary-bar{background:var(--navy);color:#fff;padding:16px 0;}
  .summary-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
  .summary-route{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;}
  .summary-meta{font-size:13px;color:rgba(255,255,255,0.7);margin-top:2px;}
  .results-body{display:grid;grid-template-columns:270px 1fr;gap:26px;margin-top:26px;align-items:start;}
  .filter-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:18px;position:sticky;top:90px;}
  .filter-panel h4{margin:18px 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);}
  .filter-panel h4:first-child{margin-top:0;}
  .filter-panel .clear{color:var(--teal);font-size:13px;font-weight:700;float:right;text-transform:none;letter-spacing:0;}
  .chk-row{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:14px;}
  .chk-row input{width:16px;height:16px;accent-color:var(--navy);}
  .range-row{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);margin-bottom:6px;}
  input[type=range]{width:100%;accent-color:var(--navy);}
  .timepill-row{display:flex;flex-wrap:wrap;gap:6px;}
  .timepill{padding:7px 12px;border-radius:16px;border:1px solid var(--border);font-size:12.5px;font-weight:600;background:#fff;}
  .timepill.active{background:var(--navy);color:#fff;border-color:var(--navy);}

  .sort-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .found-count{font-weight:700;font-size:15px;}
  .sort-tabs{display:flex;gap:6px;}
  .sort-tab{padding:8px 14px;border-radius:18px;border:1px solid var(--border);background:#fff;font-size:13px;font-weight:600;color:var(--ink-soft);}
  .sort-tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .badge-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px;}
  .badge-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-md);padding:14px 16px;cursor:pointer;transition:border-color .15s;}
  .badge-card:hover{border-color:var(--navy);}
  .badge-card .tag{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:6px;display:inline-block;margin-bottom:8px;}
  .tag-best{background:#FDF1DF;color:var(--gold-deep);}
  .tag-cheap{background:var(--success-bg);color:var(--success);}
  .tag-fast{background:#EAF3F8;color:var(--teal);}
  .badge-card .al{font-weight:700;font-size:14.5px;margin-bottom:2px;}
  .badge-card .pr{font-size:18px;font-weight:700;color:var(--navy);}
  .badge-card .meta{font-size:12.5px;color:var(--ink-faint);margin-top:4px;}

  .flight-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:18px 20px;margin-bottom:14px;}
  .flight-top{display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .airline-block{display:flex;align-items:center;gap:12px;min-width:150px;}
  .airline-logo{width:38px;height:38px;border-radius:9px;background:var(--navy);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;}
  .airline-name{font-weight:700;font-size:14.5px;}
  .flight-no{font-size:12px;color:var(--ink-faint);}
  .route-block{display:flex;align-items:center;gap:18px;flex:1;justify-content:center;}
  .rb-time{text-align:center;}
  .rb-time .t{font-size:19px;font-weight:700;}
  .rb-time .c{font-size:12.5px;color:var(--ink-faint);}
  .rb-mid{text-align:center;min-width:110px;}
  .rb-mid .dur{font-size:12.5px;color:var(--ink-soft);font-weight:600;}
  .rb-line{height:1px;background:var(--border);position:relative;margin:6px 0;}
  .rb-line .dot{position:absolute;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--ink-faint);}
  .rb-stops{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .rb-stops.direct{color:var(--success);}
  .rb-stops.stop{color:var(--coral);}
  .price-block{text-align:right;min-width:130px;}
  .price-block .p{font-size:21px;font-weight:700;color:var(--navy);}
  .price-block .pp{font-size:11.5px;color:var(--ink-faint);}
  .flight-actions{display:flex;gap:8px;margin-top:6px;justify-content:flex-end;}
  .baggage-row{display:flex;gap:16px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border-soft);font-size:13px;color:var(--ink-soft);}
  .baggage-row span{display:flex;align-items:center;gap:6px;}
  .flight-details{margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);display:none;}
  .flight-details.open{display:block;}
  .segment{display:grid;grid-template-columns:70px 1fr;gap:14px;margin-bottom:4px;}
  .seg-time{font-weight:700;font-size:14.5px;}
  .seg-body{border-left:2px solid var(--border);padding:2px 0 16px 16px;position:relative;}
  .seg-body:before{content:"";position:absolute;left:-5px;top:2px;width:8px;height:8px;border-radius:50%;background:var(--navy);}
  .seg-city{font-weight:700;font-size:14.5px;}
  .seg-sub{font-size:12.5px;color:var(--ink-faint);margin-top:1px;}
  .transit-note{background:var(--bg);border-radius:8px;padding:8px 12px;font-size:12.5px;color:var(--ink-soft);margin:6px 0 10px 16px;display:inline-block;}
  .detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px;}
  .detail-mini h5{margin:0 0 3px;font-size:11.5px;text-transform:uppercase;color:var(--ink-faint);letter-spacing:.03em;}
  .detail-mini p{margin:0;font-size:14px;font-weight:600;}
  .fare-breakdown{margin-top:16px;background:var(--bg);border-radius:10px;padding:14px 16px;}
  .fb-row{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0;color:var(--ink-soft);}
  .fb-row.total{border-top:1px solid var(--border);margin-top:6px;padding-top:10px;font-weight:700;color:var(--ink);font-size:15px;}

  /* Booking flow */
  .flow-page{max-width:920px;margin:0 auto;padding:30px 24px 80px;}
  .progress{display:flex;justify-content:space-between;margin-bottom:34px;position:relative;}
  .progress:before{content:"";position:absolute;top:14px;left:5%;right:5%;height:2px;background:var(--border);z-index:0;}
  .p-step{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;}
  .p-dot{width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:var(--ink-faint);}
  .p-step.done .p-dot{background:var(--success);border-color:var(--success);color:#fff;}
  .p-step.active .p-dot{background:var(--navy);border-color:var(--navy);color:#fff;}
  .p-label{font-size:11.5px;color:var(--ink-faint);font-weight:600;}
  .p-step.active .p-label{color:var(--navy);font-weight:700;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:22px;margin-bottom:18px;}
  .card h3{margin:0 0 4px;font-size:17px;}
  .card .card-sub{font-size:13px;color:var(--ink-faint);margin-bottom:16px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .form-grid.g3{grid-template-columns:1fr 1fr 1fr;}
  .fg{display:flex;flex-direction:column;gap:6px;}
  .fg label{font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .fg input, .fg select{padding:11px 12px;border-radius:9px;border:1.5px solid var(--border);font-size:14.5px;font-family:inherit;background:#fff;}
  .fg input:focus, .fg select:focus{outline:none;border-color:var(--teal);}
  .fg .err{font-size:12px;color:var(--coral);display:none;}
  .fg.invalid input, .fg.invalid select{border-color:var(--coral);}
  .fg.invalid .err{display:block;}
  .pax-badge{display:inline-block;background:var(--bg);border-radius:6px;padding:2px 9px;font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-left:8px;}
  .review-row{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border-soft);font-size:14px;}
  .review-row:last-child{border-bottom:none;}
  .review-row .k{color:var(--ink-faint);font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;font-weight:700;}
  .edit-link{color:var(--teal);font-size:13px;font-weight:700;}
  .pay-methods{display:flex;gap:10px;margin-bottom:18px;}
  .pay-method{flex:1;border:1.5px solid var(--border);border-radius:10px;padding:14px;text-align:center;font-weight:600;font-size:13.5px;}
  .pay-method.sel{border-color:var(--navy);background:var(--bg);}
  .sticky-cta{position:sticky;bottom:0;background:rgba(245,246,243,0.95);backdrop-filter:blur(6px);padding:16px 0;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);margin-top:10px;}
  .sticky-cta .amt{font-size:20px;font-weight:700;}
  .sticky-cta .amt span{display:block;font-size:11.5px;color:var(--ink-faint);font-weight:600;}

  .confirm-hero{text-align:center;padding:20px 0 8px;}
  .confirm-check{width:64px;height:64px;border-radius:50%;background:var(--success-bg);color:var(--success);font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
  .ref-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0;}
  .ref-box{background:var(--bg);border-radius:10px;padding:14px;text-align:center;}
  .ref-box .l{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
  .ref-box .v{font-size:19px;font-weight:700;margin-top:3px;letter-spacing:.03em;}
  .confirm-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:20px;}

  /* AI assistant */
  .ai-fab{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;border:none;border-radius:30px;padding:14px 20px;display:flex;align-items:center;gap:9px;font-weight:700;font-size:14.5px;box-shadow:0 12px 28px rgba(8,26,44,0.35);z-index:80;}
  .ai-panel{position:fixed;bottom:88px;right:24px;width:360px;max-width:90vw;background:#fff;border-radius:18px;box-shadow:0 24px 60px rgba(8,26,44,0.3);z-index:81;display:none;flex-direction:column;overflow:hidden;border:1px solid var(--border);}
  .ai-panel.open{display:flex;}
  .ai-head{background:var(--navy);color:#fff;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;}
  .ai-head .t{font-weight:700;font-size:14.5px;}
  .ai-head .s{font-size:11.5px;color:rgba(255,255,255,0.6);}
  .ai-body{padding:16px;height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;background:var(--bg);}
  .msg{max-width:82%;padding:9px 13px;border-radius:14px;font-size:13.5px;line-height:1.45;}
  .msg.bot{background:#fff;border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px;}
  .msg.user{background:var(--navy);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
  .ai-quick{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 14px;background:var(--bg);}
  .ai-input-row{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border);background:#fff;}
  .ai-input-row input{flex:1;border:1.5px solid var(--border);border-radius:20px;padding:9px 14px;font-size:13px;font-family:inherit;}
  .ai-input-row input:focus{outline:none;border-color:var(--teal);}
  .ai-input-row button{background:var(--navy);color:#fff;border:none;width:34px;height:34px;border-radius:50%;flex-shrink:0;font-size:14px;}
  .fare-compare-table{width:100%;border-collapse:collapse;margin-top:8px;}
  .fare-compare-table td{padding:7px 4px;font-size:12.5px;border-bottom:1px solid var(--border-soft);}
  .fare-compare-table tr.lowest td{font-weight:700;color:var(--success);}
  .lowest-badge{font-size:10.5px;font-weight:700;color:var(--success);margin-top:3px;}
  .qchip{background:#fff;border:1px solid var(--border);border-radius:16px;padding:7px 12px;font-size:12px;font-weight:600;color:var(--navy);}
  .ai-note{font-size:11px;color:var(--ink-faint);padding:10px 16px;background:#fff;border-top:1px solid var(--border);text-align:center;}

  /* toast */
  #toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:200;opacity:0;pointer-events:none;transition:all .25s;box-shadow:0 10px 30px rgba(0,0,0,0.25);}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* misc */
  .hide{display:none !important;}
  .badge-scope{display:inline-block;background:#FDF1DF;color:var(--gold-deep);font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;margin-left:8px;vertical-align:middle;}

  /* Account menu + mobile nav */
  .acct-wrap{position:relative;}
  .acct-btn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);color:#fff;border-radius:10px;padding:8px 14px;font-weight:600;font-size:13.5px;}
  .acct-avatar{width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--navy-deep);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .acct-menu{position:absolute;top:calc(100% + 10px);right:0;background:#fff;border-radius:12px;box-shadow:0 18px 40px rgba(8,26,44,0.2);border:1px solid var(--border);min-width:180px;overflow:hidden;z-index:60;}
  .acct-menu a, .acct-menu button{display:block;width:100%;text-align:left;padding:11px 16px;font-size:14px;font-weight:600;color:var(--ink);background:none;border:none;}
  .acct-menu a:hover, .acct-menu button:hover{background:var(--bg);}
  nav.main-nav a.active{color:#fff;}
  .mobile-nav-sheet{position:fixed;inset:0;background:rgba(8,20,33,0.55);z-index:95;display:none;}
  .mobile-nav-sheet.open{display:block;}
  .mobile-nav-panel{position:absolute;top:0;right:0;bottom:0;width:78%;max-width:320px;background:#fff;padding:20px;display:flex;flex-direction:column;}
  .mobile-nav-panel a, .mobile-nav-panel button.mnav-item{display:block;padding:13px 6px;font-size:15.5px;font-weight:600;color:var(--ink);border-bottom:1px solid var(--border-soft);background:none;border-left:none;border-right:none;border-top:none;text-align:left;width:100%;}
  .mobile-nav-close{align-self:flex-end;background:none;border:none;font-size:22px;color:var(--ink-faint);margin-bottom:6px;}
  .mnav-auth{display:flex;gap:8px;margin-top:16px;}

  /* Sub-pages: hotels, visa, services, offers, my booking, help, auth */
  .page-hero{background:var(--navy);padding:40px 0 34px;color:#fff;}
  .page-hero h1{font-size:28px;margin:0 0 6px;color:#fff;}
  .page-hero p{color:rgba(255,255,255,0.7);margin:0;font-size:14.5px;}
  .page-body{max-width:1180px;margin:0 auto;padding:32px 24px 70px;}

  .hotel-searchbar{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:16px;display:grid;grid-template-columns:1.4fr 1fr 1fr 0.9fr auto;gap:12px;align-items:end;margin-top:-58px;position:relative;z-index:5;box-shadow:var(--shadow);}
  .hotel-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px;}
  .hotel-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;}
  .hotel-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);}
  .hotel-img{height:150px;background:linear-gradient(135deg,var(--teal),var(--navy-deep));display:flex;align-items:flex-end;padding:12px;color:#fff;font-weight:700;}
  .hotel-body{padding:14px 16px;}
  .hotel-stars{color:var(--gold-deep);font-size:12.5px;margin-bottom:4px;}
  .hotel-name{font-weight:700;font-size:15px;margin-bottom:2px;}
  .hotel-loc{font-size:12.5px;color:var(--ink-faint);margin-bottom:10px;}
  .hotel-foot{display:flex;justify-content:space-between;align-items:flex-end;}
  .hotel-price{font-weight:700;color:var(--navy);font-size:16px;}
  .hotel-price span{display:block;font-weight:500;font-size:11px;color:var(--ink-faint);}
  .rating-pill{background:var(--success-bg);color:var(--success);font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;}

  .room-option{border:1.5px solid var(--border);border-radius:12px;padding:16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .room-option.reco{border-color:var(--gold);background:#FFFBF3;}
  .room-name{font-weight:700;font-size:14.5px;}
  .room-meta{font-size:12.5px;color:var(--ink-faint);margin-top:3px;}

  .service-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  .service-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:22px;}
  .service-icon{width:44px;height:44px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:12px;}
  .service-card h3{margin:0 0 6px;font-size:16px;}
  .service-card p{margin:0 0 16px;font-size:13.5px;color:var(--ink-soft);}

  .offer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  .offer-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;}
  .offer-img{height:120px;background:linear-gradient(135deg,var(--coral),var(--gold-deep));display:flex;align-items:flex-start;justify-content:space-between;padding:12px;color:#fff;font-weight:700;}
  .offer-badge{background:rgba(255,255,255,0.25);font-size:10.5px;padding:3px 8px;border-radius:6px;letter-spacing:.03em;}
  .offer-body{padding:14px 16px;}

  .faq-item{border-bottom:1px solid var(--border);}
  .faq-q{padding:16px 4px;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14.5px;cursor:pointer;}
  .faq-a{max-height:0;overflow:hidden;transition:max-height .2s ease;font-size:13.5px;color:var(--ink-soft);padding:0 4px;}
  .faq-item.open .faq-a{max-height:200px;padding-bottom:16px;}
  .faq-item.open .faq-q .chev{transform:rotate(180deg);}
  .chev{transition:transform .2s;color:var(--ink-faint);}
  .support-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px;}
  .support-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:18px;text-align:center;}
  .support-card .icon{font-size:22px;margin-bottom:8px;}

  .auth-wrap{max-width:400px;margin:0 auto;}
  .admin-entry-link{text-align:center;font-size:12.5px;color:var(--ink-faint);margin-top:16px;padding-top:14px;border-top:1px solid var(--border-soft);}
  .admin-entry-link a{color:var(--teal);font-weight:700;}
  .demo-cred-box{display:flex;gap:8px;align-items:flex-start;background:#FFFBF3;border:1px solid #F0DDB0;border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--ink-soft);margin:14px 0;line-height:1.5;}
  .auth-tabs{display:flex;gap:6px;margin-bottom:20px;justify-content:center;}
  .not-found-box{text-align:center;padding:30px 10px;}
  .pw-wrap{position:relative;}
  .pw-wrap input{width:100%;padding-right:44px;}
  .pw-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:12.5px;font-weight:700;color:var(--teal);}
  .pw-meter{display:flex;gap:4px;margin-top:7px;}
  .pw-meter i{flex:1;height:4px;border-radius:2px;background:var(--border);}
  .pw-meter i.on1{background:#E15A3C;}
  .pw-meter i.on2{background:#E3A63F;}
  .pw-meter i.on3{background:#8BB33F;}
  .pw-meter i.on4{background:#1E8A5B;}
  .pw-label{font-size:11.5px;font-weight:700;margin-top:5px;}
  .pw-reqs{font-size:11.5px;color:var(--ink-faint);margin-top:6px;line-height:1.6;}
  .pw-reqs .ok{color:var(--success);}
  .req-star{color:var(--coral);}
  .security-note{display:flex;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:11.5px;color:var(--ink-soft);margin-top:14px;line-height:1.5;}
  .captcha-box{display:flex;align-items:center;gap:14px;border:1px solid #d5d9d3;border-radius:10px;background:#fbfbfa;padding:12px 16px;width:100%;user-select:none;}
  .captcha-box.checked{border-color:var(--success);background:#F3FAF6;}
  .captcha-checkbox{width:26px;height:26px;border:2px solid #b9beb6;border-radius:5px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:border-color .15s,background .15s;}
  .captcha-checkbox.checked{border-color:var(--success);background:var(--success);color:#fff;font-weight:700;font-size:15px;}
  .captcha-spinner{width:16px;height:16px;border:2px solid #d5d9d3;border-top-color:var(--teal);border-radius:50%;animation:captchaspin .7s linear infinite;}
  @keyframes captchaspin{to{transform:rotate(360deg);}}
  .captcha-label{font-size:13.5px;font-weight:600;color:#2b2f2c;cursor:pointer;flex:1;}
  .captcha-brand{text-align:center;font-size:9px;color:#8b9088;line-height:1.25;flex-shrink:0;}
  .captcha-brand .mark{font-size:16px;line-height:1;}
  .phone-field{display:flex;gap:8px;}
  .phone-field select{width:110px;flex-shrink:0;}
  .chk-row.terms{align-items:flex-start;font-size:12.5px;color:var(--ink-soft);}
  .chk-row.terms input{margin-top:2px;}
  .acct-menu-head{padding:12px 16px;border-bottom:1px solid var(--border-soft);}
  .acct-menu-head .n{font-weight:700;font-size:14px;}
  .acct-menu-head .e{font-size:12px;color:var(--ink-faint);}
  .profile-card{display:flex;align-items:center;gap:14px;}
  .profile-avatar{width:52px;height:52px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .profile-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;margin-top:14px;}
  .profile-fields .k{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-faint);font-weight:700;}
  .profile-fields .v{font-size:14px;font-weight:600;margin-top:2px;}

  /* Admin Dashboard shell */
  .admin-shell{display:flex;min-height:calc(100vh - 72px);}
  .admin-sidebar{width:220px;flex-shrink:0;background:var(--navy-deep);color:#fff;padding:18px 0;}
  .admin-sidebar-head{padding:0 18px 18px;font-size:12.5px;font-weight:700;letter-spacing:.03em;color:rgba(255,255,255,0.6);border-bottom:1px solid rgba(255,255,255,0.1);margin-bottom:10px;}
  .admin-sidebar-head span{color:#fff;font-size:15px;display:block;margin-top:2px;}
  .admin-nav-item{display:block;width:100%;text-align:left;background:none;border:none;color:rgba(255,255,255,0.75);padding:11px 18px;font-size:13.5px;font-weight:600;}
  .admin-nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
  .admin-nav-item.active{background:rgba(255,255,255,0.1);color:#fff;border-right:3px solid var(--gold);}
  .admin-main{flex:1;background:var(--bg);min-width:0;}
  .admin-topbar{background:#fff;border-bottom:1px solid var(--border);padding:16px 28px;display:flex;justify-content:space-between;align-items:center;}
  .admin-content{padding:24px 28px 60px;max-width:1000px;}
  .admin-stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  .admin-stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--r-md);padding:16px;}
  .admin-stat-card .v{font-size:22px;font-weight:700;color:var(--navy);}
  .admin-stat-card .l{font-size:12px;color:var(--ink-faint);margin-top:2px;}
  .mini-chart{display:flex;gap:24px;align-items:flex-end;height:120px;margin-top:14px;padding-top:10px;}
  .mini-bar-wrap{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;width:60px;}
  .mini-bar{width:32px;background:linear-gradient(180deg,var(--teal),var(--navy));border-radius:6px 6px 0 0;min-height:4px;}
  .mini-bar-label{font-size:11px;color:var(--ink-faint);margin-top:6px;}
  .partner-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border-soft);}
  .partner-row:last-child{border-bottom:none;}
  .btn-text{background:none;border:none;color:var(--teal);font-weight:700;font-size:12px;padding:0 0 0 6px;}

  /* mobile */
  .filter-toggle-mobile{display:none;}
  @media(max-width:920px){
    nav.main-nav{display:none;}
    .header-actions .link-plain{display:none;}
    .burger{display:block;}
    .hero h1{font-size:32px;}
    .hero{padding:36px 0 260px;}
    .search-card{padding:16px;margin-top:-230px;}
    .search-grid{grid-template-columns:1fr;border:none;gap:10px;}
    .field{border:1px solid var(--border-soft);border-radius:10px;}
    .swap-btn{right:14px;top:auto;bottom:-17px;transform:none;}
    .swap-btn.spin{transform:rotate(180deg);}
    .dest-grid{grid-template-columns:1fr 1fr;}
    .trust-grid{grid-template-columns:1fr 1fr;}
    .footer-grid{grid-template-columns:1fr 1fr;}
    .results-body{grid-template-columns:1fr;}
    .filter-panel{display:none;position:fixed;inset:0;z-index:90;border-radius:0;overflow-y:auto;}
    .filter-panel.open{display:block;}
    .filter-toggle-mobile{display:flex;position:sticky;bottom:16px;margin:16px auto 0;background:var(--navy);color:#fff;border:none;border-radius:24px;padding:12px 22px;font-weight:700;font-size:13.5px;box-shadow:0 10px 26px rgba(8,26,44,0.3);width:fit-content;}
    .flight-top{flex-wrap:wrap;}
    .route-block{order:3;width:100%;justify-content:space-between;margin-top:10px;}
    .price-block{text-align:left;}
    .form-grid,.form-grid.g3{grid-template-columns:1fr;}
    .ref-grid{grid-template-columns:1fr;}
    .confirm-actions{grid-template-columns:1fr;}
    .badge-strip{grid-template-columns:1fr;}
    .ai-panel{right:10px;left:10px;width:auto;}
    .ai-fab{right:16px;}
    .hotel-searchbar{grid-template-columns:1fr;margin-top:-30px;}
    .hotel-grid,.service-grid,.offer-grid{grid-template-columns:1fr;}
    .support-grid{grid-template-columns:1fr 1fr;}
    .mc-row{flex-direction:column;align-items:stretch;}
    .mc-fields{grid-template-columns:1fr;border:none;gap:10px;}
    .mc-fields .field{border:1px solid var(--border-soft);border-radius:10px;}
    .mc-fields .swap-btn{border-radius:50%;background:#fff;border:1px solid var(--border);width:34px;height:34px;box-shadow:var(--shadow);}
    .mc-num{width:auto;}
    .mc-bottom-row{flex-direction:column;align-items:stretch;}
    .admin-shell{flex-direction:column;}
    .admin-sidebar{width:100%;padding:10px 0;}
    .admin-sidebar nav{display:flex;overflow-x:auto;}
    .admin-nav-item{white-space:nowrap;padding:8px 14px;}
    .admin-nav-item.active{border-right:none;border-bottom:3px solid var(--gold);}
    .admin-stat-grid{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>
<div id="toast"></div>
<div id="app"></div>
<div class="mobile-nav-sheet" id="mobileNavSheet" onclick="if(event.target===this) closeMobileNav()"></div>
<button class="ai-fab" onclick="toggleAI()">✦ Ask AI</button>
<div class="ai-panel" id="aiPanel">
  <div class="ai-head">
    <div><div class="t">Mohammad Travels AI</div><div class="s">Guided search &amp; price check</div></div>
    <button onclick="toggleAI()" style="background:none;border:none;color:#fff;font-size:18px;">✕</button>
  </div>
  <div class="ai-body" id="aiBody"></div>
  <div class="ai-quick" id="aiQuick"></div>
  <div class="ai-input-row">

function airlinesForRoute(from,to){

/* ---------------- SIMULATED MULTI-SOURCE FARE COMPARISON ----------------
   IMPORTANT: this does not fetch real prices from any airline or agency
   website. A static, browser-only page cannot do that — cross-site fetches
   to arbitrary third-party domains are blocked by the browser (CORS), and
   most airline sites' terms of service prohibit scraping fares anyway. A
   real version of this feature needs a server that talks to licensed fare
   sources (a GDS/NDC API such as Amadeus, Sabre or Travelport, or a
   metasearch partner API). This function fabricates plausible partner
   quotes around our own mock price purely to demonstrate the comparison UI. */
const PARTNER_SOURCES = ['Mohammad Travels (direct)','SkyLink Partners','FareBridge Consolidator','GlobalRoute B2B'];
/* getActiveSources(): once Mohammad Travels' admin has added real supplier/
   agency connections (see the Admin Console), the auto-search uses those
   names instead of the generic placeholder list — so what admin configures
   is what actually appears to customers as the sourced fares. */
function getActiveSources(){
  return state.supplierConnections.length
    ? ['Mohammad Travels (direct)', ...state.supplierConnections.map(c=>c.name)]
    : PARTNER_SOURCES;
}
function simulateFareComparison(baseFare, seedStr, sources){
  sources = sources || PARTNER_SOURCES;
  let seed=0; for(let i=0;i<seedStr.length;i++) seed=(seed*31+seedStr.charCodeAt(i))>>>0;
  function rand(){ seed=(seed*1103515245+12345)>>>0; return (seed/4294967296); }
  const rows = sources.map((name,i)=>{
    const variance = i===0 ? 0 : (rand()*0.09-0.03); // direct price is our real quoted fare
    const price = Math.round((baseFare*(1+variance))/50)*50;
    return {name, price};
  });
  rows.sort((a,b)=>a.price-b.price);
  return rows;
}
function fareCompareTableHTML(rows){
  return `<table class="fare-compare-table">
    ${rows.map((r,i)=>`<tr class="${i===0?'lowest':''}"><td>${i===0?'✓ ':''}${r.name}</td><td style="text-align:right;">${fmtMoney(r.price)}</td></tr>`).join('')}
  </table>
  <div style="font-size:10.5px;color:var(--ink-faint);margin-top:6px;">Simulated comparison for this demo — not fetched from real airline or agency websites.</div>`;
}
/* autoLowestFlights(): the internal Fare Collection + Pricing Engine.
   Each flight is priced by (1) simulating a check across connected B2B
   partners to find the lowest NET fare, then (2) applying Mohammad Travels'
   configured markup on top. IMPORTANT — the customer-facing side (fl.price)
   is the selling price ONLY. fl.netFare, fl.markup and fl.supplierName are
   attached for admin-only use (B2B Partners / Fare Collection / Bookings
   tabs in the Admin Dashboard) and must never be read by customer-facing
   rendering code — see the Admin Dashboard section for where they surface. */
function autoLowestFlights(flights, seedPrefix, fromCode, toCode){
  const sources = getActiveSources();
  fromCode = fromCode || state.from.code; toCode = toCode || state.to.code;
  return flights.map(fl=>{
    const rows = simulateFareComparison(fl.price, seedPrefix+fl.id, sources);
    const netFare = rows[0].price;
    const markup = computeMarkup(netFare, fromCode, toCode, state.cabin);
    return {...fl, netFare, markup, supplierName: rows[0].name, compareRows: rows, price: netFare+markup};
  });
}
function computeMarkup(netFare, fromCode, toCode, cabin){
  const r = state.pricingRules;
  const override = r.overrides.find(o=> (!o.from||o.from===fromCode) && (!o.to||o.to===toCode) && (!o.cabin||o.cabin===cabin) );
  const rule = override || {type:r.defaultType, value:r.defaultValue};
  return rule.type==='fixed' ? rule.value : Math.round(netFare*(rule.value/100)/10)*10;
}

function multiCalendarDropdown(i,minDate){
  const seg=state.multiSegments[i];
  const base=new Date(seg.date+'T00:00:00'); base.setMonth(base.getMonth()+(state.calMonthOffset||0));
  const y=base.getFullYear(), m=base.getMonth();
  const first=new Date(y,m,1); const startDow=first.getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const today=new Date(); today.setHours(0,0,0,0);
  const atEarliestMonth = y<today.getFullYear() || (y===today.getFullYear() && m<=today.getMonth());
  let cells='';
  for(let d0=0;d0<startDow;d0++) cells+=`<div></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const iso=new Date(y,m,d).toISOString().slice(0,10);
    const disabled = iso<minDate;
    const sel = iso===seg.date;
    cells+=`<div class="cal-day ${disabled?'disabled':''} ${sel?'sel':''}" ${disabled?'':`onclick="selectMultiDate(${i},'${iso}')"`}>${d}</div>`;
  }
  const dows=['Su','Mo','Tu','We','Th','Fr','Sa'];
  return `<div class="dropdown-panel cal-panel" onclick="event.stopPropagation()">
    <div class="cal-header">
      <button class="cal-nav" onclick="changeCalMonth(-1)" ${atEarliestMonth?'disabled':''}>‹</button>
      <span>${first.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</span>
      <button class="cal-nav" onclick="changeCalMonth(1)">›</button>
    </div>

    ${i>0?`<div style="font-size:11.5px;color:var(--ink-faint);margin-top:8px;text-align:center;">Must be on or after Flight ${i}'s date, per airline multi-city rules.</div>`:''}
  </div>`;
}
function selectMultiDate(i,iso){
  state.multiSegments[i].date=iso;
  for(let j=i+1;j<state.multiSegments.length;j++){
    if(state.multiSegments[j].date<state.multiSegments[i].date) state.multiSegments[j].date=state.multiSegments[i].date;
  }

  state.multiOpenField=null; render();
}
function swapMultiSegment(e,i){
  e.stopPropagation();

function addMultiSegment(){
  if(state.multiSegments.length>=6) return;
  const last=state.multiSegments[state.multiSegments.length-1];
  const d=new Date(last.date); d.setDate(d.getDate()+3);
  const defaultTo = AIRPORTS.find(a=>a.code!==last.to.code) || AIRPORTS[1];
  state.multiSegments.push({from:last.to, to:defaultTo, date:d.toISOString().slice(0,10)});
  render();
}
function removeMultiSegment(i){

function doMultiSearch(){

  if(!state.multiSelected.every(s=>s!==null)){ showToast('Please select a flight for every leg'); return; }

  const p=state.passengers;
  const forms=[];
  for(let i=0;i<p.adults;i++) forms.push({type:'Adult',title:'Mr',first:'',last:'',dob:'',passport:'',expiry:''});
  for(let i=0;i<p.children;i++) forms.push({type:'Child',title:'Mstr',first:'',last:'',dob:'',passport:'',expiry:''});
  for(let i=0;i<p.infants;i++) forms.push({type:'Infant',title:'Inf',first:'',last:'',dob:'',passport:'',expiry:''});
  state.passengerForms=forms;
  state.selectedFlight=null;

function calendarDropdown(field){
  const selDate = field==='depart'?state.departDate:state.returnDate;

  const base = new Date(selDate+'T00:00:00');

  const y=base.getFullYear(), m=base.getMonth();
  const first = new Date(y,m,1); const startDow=first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const today=new Date(); today.setHours(0,0,0,0);
  const atEarliestMonth = y<today.getFullYear() || (y===today.getFullYear() && m<=today.getMonth());
  let cells='';
  for(let i=0;i<startDow;i++) cells+=`<div></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const iso = new Date(y,m,d).toISOString().slice(0,10);
    const disabled = iso < minDate;
    const sel = iso===selDate;
    cells+=`<div class="cal-day ${disabled?'disabled':''} ${sel?'sel':''}" ${disabled?'':`onclick="selectDate('${field}','${iso}')"`}>${d}</div>`;
  }
  const dows=['Su','Mo','Tu','We','Th','Fr','Sa'];
  return `<div class="dropdown-panel cal-panel" onclick="event.stopPropagation()">
    ${field==='depart' ? `<div class="cal-quick">
      <button class="cal-quick-chip" onclick="selectDate('depart','${todayISO(0)}')">Today</button>
      <button class="cal-quick-chip" onclick="selectDate('depart','${todayISO(1)}')">Tomorrow</button>
      <button class="cal-quick-chip" onclick="selectDate('depart','${nextWeekendISO()}')">This weekend</button>
    </div>` : ''}
    <div class="cal-header">
      <button class="cal-nav" onclick="changeCalMonth(-1)" ${atEarliestMonth?'disabled':''}>‹</button>
      <span>${first.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</span>
      <button class="cal-nav" onclick="changeCalMonth(1)">›</button>
    </div>
    <div class="cal-grid">${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
    <div style="font-size:12px;color:var(--ink-faint);margin-top:10px;text-align:center;">Flexible dates &amp; fare comparison require a live fare-calendar feed.</div>
  </div>`;
}
function changeCalMonth(delta){ state.calMonthOffset=(state.calMonthOffset||0)+delta; render(); }
function nextWeekendISO(){
  const d=new Date(); const day=d.getDay();

}

/* -- interactions -- */
function goHome(e){e&&e.preventDefault(); state.view='home'; state.openField=null; render(); return false;}
function setTripType(t){state.tripType=t; render();}
function openField(e,f){e.stopPropagation(); if(f==='from'||f==='to') state.airportQuery=''; if(f==='depart'||f==='return') state.calMonthOffset=0; state.openField = state.openField===f?null:f; render();}
function closeField(e){e&&e.stopPropagation(); state.openField=null; render();}
function selectAirport(field,code){
  const a = AIRPORTS.find(x=>x.code===code);
  if(field==='from') state.from=a; else state.to=a;
  state.openField=null; render();
}
function swapAirports(e){
  e.stopPropagation();
  const btn=e.currentTarget;
  if(btn) btn.classList.add('spin');
  setTimeout(()=>{
    const t=state.from; state.from=state.to; state.to=t;
    render();
  }, 300);
}
function selectDate(field,iso){
  if(field==='depart'){ state.departDate=iso; if(state.returnDate<iso){ const d=new Date(iso); d.setDate(d.getDate()+5); state.returnDate=d.toISOString().slice(0,10);} }
  else { state.returnDate=iso; }
  state.calMonthOffset=0;
  state.openField=null; render();
}
function changePax(type,delta){
  const p=state.passengers; p[type]=Math.max(0,p[type]+delta);
  if(type==='adults') p.adults=Math.max(1,p.adults);
  if(p.infants>p.adults) p.infants=p.adults;
  render();
}

/* ---------------- RECENT SEARCHES ---------------- */
function saveRecentSearch(){
  const entry = {fromCode:state.from.code, fromCity:state.from.city, toCode:state.to.code, toCity:state.to.city, date:state.departDate, tripType:state.tripType, cabin:state.cabin};
  state.recentSearches = state.recentSearches.filter(r=> !(r.fromCode===entry.fromCode && r.toCode===entry.toCode));
  state.recentSearches.unshift(entry);
  if(state.recentSearches.length>5) state.recentSearches.length=5;
}
function recentAirportCodes(){
  const codes=[];
  state.recentSearches.forEach(r=>{ if(!codes.includes(r.fromCode)) codes.push(r.fromCode); if(!codes.includes(r.toCode)) codes.push(r.toCode); });
  return codes.slice(0,4).map(c=>AIRPORTS.find(a=>a.code===c)).filter(Boolean);
}
function applyRecentSearch(idx){
  const r=state.recentSearches[idx];
  if(!r) return;
  state.from=AIRPORTS.find(a=>a.code===r.fromCode);
  state.to=AIRPORTS.find(a=>a.code===r.toCode);
  state.departDate = r.date < todayISO(0) ? todayISO(7) : r.date;
  state.tripType = r.tripType==='multicity' ? 'roundtrip' : r.tripType;
  state.cabin = r.cabin;
  doSearch();
}
function attachOutsideClick(){
  document.body.onclick = ()=>{ if(state.openField || state.acctMenuOpen || state.multiOpenField){ state.openField=null; state.acctMenuOpen=false; state.multiOpenField=null; render(); } };

function doSearch(){
  if(state.from.code===state.to.code){ showToast('Origin and destination cannot be the same'); return; }
  if(state.tripType==='multicity') state.tripType='roundtrip';
  state.fareSearchCount++;
  saveRecentSearch();
  state.flights = autoLowestFlights(genFlights(state.from,state.to), state.from.code+state.to.code+state.departDate+'-');
  state.filters={stops:new Set(),airlines:new Set(),depTime:new Set(),priceMax:60000};
  state.sortBy='recommended';
  state.expandedFlight=null;
  const cheapestOwn = [...state.flights].sort((a,b)=>a.price-b.price)[0];

}

function filteredFlights(){
  let list = [...state.flights];
  const f=state.filters;
  if(f.stops.size) list = list.filter(fl=> f.stops.has(fl.stops===0?'direct':fl.stops===1?'1stop':'2plus'));
  if(f.airlines.size) list = list.filter(fl=>f.airlines.has(fl.airline));
  if(f.depTime.size) list = list.filter(fl=>f.depTime.has(depBucket(fl.dep)));
  list = list.filter(fl=>fl.price<=f.priceMax);
  if(state.sortBy==='cheapest') list.sort((a,b)=>a.price-b.price);
  else if(state.sortBy==='fastest') list.sort((a,b)=>a.durMin-b.durMin);
  else if(state.sortBy==='earliest') list.sort((a,b)=>a.dep.localeCompare(b.dep));
  else list.sort((a,b)=> (a.price + a.durMin*20) - (b.price + b.durMin*20));
  return list;
}
function depBucket(t){const h=parseInt(t.split(':')[0]); if(h<6) return 'night'; if(h<12) return 'morning'; if(h<18) return 'afternoon'; return 'evening';}

/* ---------------- BOOKING FLOW WRAPPER ---------------- */
function flowWrap(step,inner){
  const steps=[['results','Flight'],['passengers','Passenger'],['review','Review'],['payment','Payment'],['confirmation','Done']];
  const order=['results','passengers','review','payment','confirmation'];
  const idx = order.indexOf(step);
  return `<div class="flow-page">
    <div class="progress">
      ${['Search','Flight','Passenger','Review','Payment','Confirmation'].map((label,i)=>{
        const stepMap=['results','results','passengers','review','payment','confirmation'];
        const thisIdx = i<=1? (i===0?-1:0) : i-1; // rough map: Search(done),Flight(done),Passenger,Review,Payment,Confirmation
        let cls='';
        const stateOrder=['results','passengers','review','payment','confirmation'];
        const curr = stateOrder.indexOf(step);
        const thisStepIdx = i===0? -1 : stateOrder.indexOf(stepMap[i]);
        if(i===0 || i===1){ cls='done'; }
        else if(stepMap[i]===step) cls='active';
        else if(stateOrder.indexOf(stepMap[i]) < curr) cls='done';
        return `<div class="p-step ${cls}"><div class="p-dot">${cls==='done'?'✓':i+1}</div><div class="p-label">${label}</div></div>`;
      }).join('')}
    </div>
    ${inner}
  </div>`;
}

/* ---------------- PRICE REVALIDATION ----------------
   Re-checks the fare against the (simulated) source before allowing
   payment, per the "never silently charge a different price" rule. The
   outcome is deterministic per booking (seeded from the route/date) rather
   than truly random, so it's reproducible for demo purposes — a real
   system would re-query the actual partner/GDS here. */
function startFareRevalidation(){
  showToast('Verifying current fare with our network…');
  setTimeout(()=>{
    const seed = tripRouteLabel() + (state.tripType==='multicity' ? state.multiItinerary.map(l=>l.date).join('') : state.departDate) + (state.bookingRef||'seed');
    let h=0; for(let i=0;i<seed.length;i++) h=(h*31+seed.charCodeAt(i))>>>0;
    const changed = (h%5===0); // ~20% of the time, for demo variety
    if(changed){
      const bumpPct = 0.03 + (h%3)*0.01;
      const oldPerPax = perPaxTotal();
      const newPerPax = Math.round(oldPerPax*(1+bumpPct)/50)*50;
      state.fareRevalidation = {oldPerPax, newPerPax, oldTotal: oldPerPax*totalPax(), newTotal: newPerPax*totalPax()};
      state.view='fareChanged'; render();
    } else {
      showToast('Fare verified — no change.');
      state.view='payment'; render();
    }
  }, 900);
}
function fareChangedHTML(){
  const r=state.fareRevalidation;
  return `<div class="card">
    <div style="text-align:center;">
      <div style="font-size:32px;">⚠️</div>
      <h2 style="margin:8px 0 4px;">Fare updated</h2>
      <p style="color:var(--ink-soft);">The price changed slightly since you started. This can happen if fares move between search and checkout — we never charge a different price without asking first.</p>

}
function acceptFareChange(){
  state.fareAdjustment = state.fareRevalidation.newPerPax - state.fareRevalidation.oldPerPax;

function verifyHuman(key){
  if(state.captcha[key].checked || state.captcha[key].loading) return;
  state.captcha[key].loading=true; render();
  setTimeout(()=>{ state.captcha[key].loading=false; state.captcha[key].checked=true; render(); }, 850);
}
function countryDial(name){ const c=COUNTRIES.find(x=>x.name===name); return c?c.dial:'+—'; }
function switchAuthMode(mode){ state.errors={}; state.captcha.auth={checked:false,loading:false}; navigate(mode); }
function passwordStrength(pw){
  if(!pw) return {score:0,label:'',color:'var(--ink-faint)'};
  let score=0;
  if(pw.length>=8) score++;
  if(/[A-Za-z]/.test(pw)&&/[0-9]/.test(pw)) score++;
  if(/[^A-Za-z0-9]/.test(pw)) score++;
  if(pw.length>=12) score++;
  const labels=['Too short','Weak','Fair','Good','Strong'];
  const colors=['var(--coral)','var(--coral)','#B8860B','#8BB33F','var(--success)'];
  return {score, label:labels[score], color:colors[score]};
}
/* passwordMeterHTML() / updatePasswordMeter(): the live strength meter used
   to be refreshed by re-rendering the ENTIRE page on every keystroke, which
   destroyed and recreated the <input> each time — the browser drops focus
   from an input the instant its DOM node is replaced, so typing a password
   only ever registered one character before you had to click back in. The
   fix is to update just this meter's own subtree, leaving the input (and
   its focus/cursor position) completely untouched while you type. */
function passwordMeterHTML(pw){
  const s = passwordStrength(pw);
  return `<div class="pw-meter"><i class="${s.score>=1?'on'+s.score:''}"></i><i class="${s.score>=2?'on'+s.score:''}"></i><i class="${s.score>=3?'on'+s.score:''}"></i><i class="${s.score>=4?'on'+s.score:''}"></i></div>
  <div class="pw-label" style="color:${s.color}">${s.label}</div>
  <div class="pw-reqs">
    <div class="${pw.length>=8?'ok':''}">${pw.length>=8?'✓':'•'} At least 8 characters</div>
    <div class="${/[A-Za-z]/.test(pw)&&/[0-9]/.test(pw)?'ok':''}">${/[A-Za-z]/.test(pw)&&/[0-9]/.test(pw)?'✓':'•'} Letters and numbers</div>
    <div class="${/[^A-Za-z0-9]/.test(pw)?'ok':''}">${/[^A-Za-z0-9]/.test(pw)?'✓':'•'} One special character (recommended)</div>
  </div>`;
}
function updatePasswordMeter(){
  const el = document.getElementById('pwMeterWrap');
  if(el) el.innerHTML = passwordMeterHTML(state.authForm.password);
}
function togglePasswordVisibility(){
  state.showPassword=!state.showPassword;
  render();
  const input=document.getElementById('authPasswordInput');
  if(input){ input.focus(); const v=input.value; input.value=''; input.value=v; }
}
function submitAuth(mode){
  const f=state.authForm; const errors={};
  if(mode==='register' && !f.name.trim()) errors.auth_name=true;
  if(!f.email.includes('@')||!f.email.includes('.')) errors.auth_email=true;
  if(mode==='register'){
    if(!f.country) errors.auth_country=true;
    if(!f.phone || f.phone.length<7) errors.auth_phone=true;
    const strong = f.password.length>=8 && /[A-Za-z]/.test(f.password) && /[0-9]/.test(f.password);
    if(!strong) errors.auth_password=true;
    if(f.confirm!==f.password || !f.confirm) errors.auth_confirm=true;
    if(!f.agree) errors.auth_agree=true;
  } else {
    if(!f.password) errors.auth_password=true;
  }
  if(!state.captcha.auth.checked) errors.auth_captcha=true;
  state.errors=errors;
  if(Object.keys(errors).length){ render(); showToast('Please complete the required fields'); return; }

  if(mode==='login'){
    const existing = state.registeredUsers.find(u=>u.email.toLowerCase()===f.email.trim().toLowerCase());
    if(!existing){
      // No account found for this email — hand off straight to registration,
      // per the "one button" flow: login and sign-up share a single entry
      // point, so an unrecognized email should lead to creating an account
      // rather than silently logging in with an empty profile.
      state.authForm={...f, name:'', country:'', phone:'', confirm:'', agree:false};
      state.errors={};
      state.captcha.auth={checked:false,loading:false};
      state.view='register';
      showToast("We couldn't find an account for that email — let's get you registered.");
      render();
      return;
    }
    state.user = existing;
    showToast('Logged in');
  } else {
    const profile = {name:f.name.trim(), email:f.email.trim(), phone:f.phone, dialCode:countryDial(f.country), country:f.country};
    state.registeredUsers = state.registeredUsers.filter(u=>u.email.toLowerCase()!==profile.email.toLowerCase());
    state.registeredUsers.push(profile);
    state.user = profile;
    showToast('Account created — you\'re logged in');
  }
  state.authForm={name:'',email:'',phone:'',country:'',password:'',confirm:'',agree:false};
  state.errors={};
  state.captcha.auth={checked:false,loading:false};
  state.view='home'; render();
}

function findMyBooking(){
  const q=state.myBookingQuery;
  if(!q.pnr.trim()||!q.lastName.trim()){ showToast('Enter both your PNR and last name'); return; }
  const pnr = q.pnr.trim().toUpperCase();
  const lastName = q.lastName.trim().toLowerCase();
  const bookingLast = state.passengerForms[0] ? state.passengerForms[0].last.trim().toLowerCase() : '';
  const matchesFlight = state.pnr && pnr===state.pnr.toUpperCase() && lastName===bookingLast;
  const matchesHotel = state.hotelBookingRef && pnr===state.hotelBookingRef.toUpperCase();
  if(matchesFlight){
    state.myBookingResult = {type:'flight'};
  } else if(matchesHotel){
    state.myBookingResult = {type:'hotel'};
  } else {
    state.myBookingResult = null;
  }
  render();
}
function renderMyBookingResult(){
  if(state.myBookingResult===undefined) return '';
  if(state.myBookingResult===null){
    return `<div class="card not-found-box">

      <p style="color:var(--ink-soft);font-size:13.5px;">Double-check your PNR and last name, or reach out below.</p>

        <button class="btn btn-outline" onclick="showToast('WhatsApp support requires the WhatsApp Business integration')">WhatsApp</button>
      </div>
    </div>`;
  }
  if(state.myBookingResult.type==='flight'){
    const isMulti = state.tripType==='multicity';
    return `<div class="card">

      <div class="review-row"><span>PNR</span><span>${state.pnr}</span></div>

        : `<div class="review-row"><span>Flight</span><span>${state.selectedFlight.airline} ${airlineCode(state.selectedFlight.airline)}${state.selectedFlight.num} · ${fmtDate(state.departDate)}</span></div>`}

        <button class="btn btn-outline" onclick="showToast('E-ticket download connects to ticketing in production')">Download ticket</button>
        <button class="btn btn-outline" onclick="showToast('Cancellation requests route to a human agent in production')">Request cancellation</button>
      </div>
    </div>`;
  }
  return `<div class="card">
    <h3>Hotel booking found</h3>
    <div class="review-row"><span>Reference</span><span>${state.hotelBookingRef}</span></div>
    <div class="review-row"><span>Hotel</span><span>${state.selectedHotel?state.selectedHotel.name:'—'}</span></div>

/* simulateLoginToPartner(): models "administrator clicks Login, system uses
   the stored credential to sign into the partner portal." No real network
   request happens — outcome is picked from a small deterministic set of
   realistic states, same categories a real integration would report
   (connected / needs manual verification / session expired / failed). Per
   your spec, a real system must never attempt to bypass CAPTCHA/MFA/OTP —
   it should stop and ask the human admin to complete it, which is exactly
   what the "Verification required" outcome represents here. */
function simulateLoginToPartner(id){
  const c = state.supplierConnections.find(x=>x.id===id);
  if(!c) return;
  showToast('Logging into '+c.name+'…');
  setTimeout(()=>{
    let seed=0; for(let i=0;i<(c.id+Date.now()).length;i++) seed=(seed*31+(c.id+Date.now()).charCodeAt(i))>>>0;
    const outcomes=['active','active','active','verification_required','session_expired','login_failed'];
    const outcome = outcomes[seed%outcomes.length];
    c.status = outcome;
    logActivity('Login attempt to '+c.name+': '+STATUS_META[outcome].label);
    if(outcome==='verification_required'){
      showToast(c.name+': additional verification required — please complete it manually on the partner site.');
    } else if(outcome==='active'){
      showToast(c.name+': connected successfully.');
    } else {
      showToast(c.name+': '+STATUS_META[outcome].label.toLowerCase()+'.');
    }
    render();
  }, 700);
}

  return `

      <div class="fg"><label>To</label><select onchange="state.fareCollectionQuery.toCode=this.value">${AIRPORTS.map(a=>`<option value="${a.code}" ${q.toCode===a.code?'selected':''}>${a.city} (${a.code})</option>`).join('')}</select></div>

  </div>
  ${q.log ? `
  <div class="card">
    <h3>Results: ${q.log.fromCode} → ${q.log.toCode}</h3>
    ${q.log.rows.map(r=>`<div class="review-row"><span>${r.failed?'❌':'✅'} ${r.name}</span><span>${r.failed?r.reason:fmtMoney(r.price)+(r.selected?' — ✓ Selected (lowest)':'')}</span></div>`).join('')}
    <div class="review-row" style="border-top:2px solid var(--border);margin-top:6px;padding-top:12px;">
      <span><strong>Net fare (lowest)</strong></span><span>${fmtMoney(q.log.netFare)}</span>
    </div>
    <div class="review-row"><span>Mohammad Travels markup</span><span>${fmtMoney(q.log.markup)}</span></div>
    <div class="review-row"><span><strong>Customer selling price</strong></span><span><strong>${fmtMoney(q.log.sellingPrice)}</strong></span></div>
  </div>` : ''}`;

function runFareCollection(){
  const q=state.fareCollectionQuery;
  if(q.fromCode===q.toCode){ showToast('Choose two different airports'); return; }
  const from=AIRPORTS.find(a=>a.code===q.fromCode), to=AIRPORTS.find(a=>a.code===q.toCode);
  const flights=genFlights(from,to);
  const cheapest=[...flights].sort((x,y)=>x.price-y.price)[0];
  const activeSources = state.supplierConnections.length ? state.supplierConnections.filter(c=>c.status!=='disabled') : PARTNER_SOURCES.slice(1).map(name=>({name,status:'active'}));
  const allSourceNames = ['Mohammad Travels (direct)', ...(state.supplierConnections.length ? state.supplierConnections.map(c=>c.name) : PARTNER_SOURCES.slice(1))];
  const rows = simulateFareComparison(cheapest.price, q.fromCode+q.toCode+q.date, allSourceNames).map(r=>{
    const partnerRecord = state.supplierConnections.find(c=>c.name===r.name);
    const failed = partnerRecord && (partnerRecord.status==='login_failed' || partnerRecord.status==='session_expired' || partnerRecord.status==='disabled');
    return failed ? {...r, failed:true, reason: STATUS_META[partnerRecord.status].label} : r;
  });
  const succeeded = rows.filter(r=>!r.failed).sort((a,b)=>a.price-b.price);
  succeeded.forEach((r,i)=>{ r.selected = i===0; });
  const netFare = succeeded[0] ? succeeded[0].price : cheapest.price;
  const markup = computeMarkup(netFare, q.fromCode, q.toCode, state.cabin);
  q.log = {fromCode:q.fromCode, toCode:q.toCode, rows, netFare, markup, sellingPrice: netFare+markup};
  logActivity('Fare collection run: '+q.fromCode+' → '+q.toCode+' — selling price '+fmtMoney(netFare+markup));
  render();
}

      <div class="fg"><label>From (optional)</label><select onchange="state.pricingOverrideForm.from=this.value"><option value="">Any</option>${AIRPORTS.map(a=>`<option value="${a.code}">${a.code}</option>`).join('')}</select></div>
      <div class="fg"><label>To (optional)</label><select onchange="state.pricingOverrideForm.to=this.value"><option value="">Any</option>${AIRPORTS.map(a=>`<option value="${a.code}">${a.code}</option>`).join('')}</select></div>
      <div class="fg"><label>Cabin (optional)</label><select onchange="state.pricingOverrideForm.cabin=this.value"><option value="">Any</option><option>Economy</option><option>Premium Economy</option><option>Business</option><option>First</option></select></div>
      <div class="fg"><label>Type</label><select onchange="state.pricingOverrideForm.type=this.value"><option value="percentage">Percentage</option><option value="fixed">Fixed amount</option></select></div>
      <div class="fg"><label>Value</label><input type="number" value="${of_.value}" oninput="state.pricingOverrideForm.value=parseFloat(this.value)||0"></div>
      <div class="fg" style="align-self:end;"><button class="btn btn-primary" onclick="addPricingOverride()">Add rule</button></div>
    </div>
    ${r.overrides.length===0 ? `<p style="color:var(--ink-faint);font-size:13.5px;margin-top:10px;">No route-specific rules yet.</p>` :
    r.overrides.map((o,i)=>`<div class="review-row"><span>${o.from||'Any'} → ${o.to||'Any'} ${o.cabin?'· '+o.cabin:''}</span><span>${o.type==='fixed'?fmtMoney(o.value):o.value+'%'} <button class="btn-text" onclick="removePricingOverride(${i})">Remove</button></span></div>`).join('')}
  </div>`;
}
function addPricingOverride(){
  const of_=state.pricingOverrideForm;
  state.pricingRules.overrides.push({...of_});
  logActivity('Pricing override added: '+(of_.from||'Any')+' → '+(of_.to||'Any')+' = '+(of_.type==='fixed'?fmtMoney(of_.value):of_.value+'%'));
  state.pricingOverrideForm={from:'',to:'',cabin:'',type:'percentage',value:5};
  showToast('Pricing rule added');
  render();
}
function removePricingOverride(i){
  state.pricingRules.overrides.splice(i,1);
  render();
}
